[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["__pycache__", ".git"]

[tool.ruff.lint]
# pycodestyle, Pyflakes, import sorting, bugbear, comprehensions.
select = ["E", "F", "I", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert patterns and helper indirection freely.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
